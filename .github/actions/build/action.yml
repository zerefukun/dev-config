name: Build
description: >-
  `bun run build`, with the build tool's cache kept in GitHub's Actions cache
  between runs.

inputs:
  cache:
    description: >-
      Paths the build tool caches in, one per line and relative to the
      repository root, such as `.next/cache` for a Next app. Restored from
      GitHub's Actions cache before the build and saved there after one that
      passed, keyed on bun.lock, the newest save under that key restored. A
      cache that cannot be read or written warns and costs the cache, never the
      build. A path that is absolute, has a `..` segment, is the repository
      root, is named twice or sits inside another named path, or a repository
      with no bun.lock, is refused before the build. Empty, the default, runs
      `bun run build` and keeps nothing.
    default: ""

runs:
  using: composite
  steps:
    - id: cache
      shell: bash
      env:
        BUILD_CACHE: ${{ inputs.cache }}
      run: bash "$GITHUB_ACTION_PATH/cache-paths.sh"

    - if: steps.cache.outputs.paths != ''
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.cache.outputs.paths }}
        key: ${{ steps.cache.outputs.key }}
        restore-keys: ${{ steps.cache.outputs.restore-key }}

    - shell: bash
      run: bun run build

    # After the build alone, which a failed one never reaches, so a broken
    # build's output is never what the next run restores.
    - if: steps.cache.outputs.paths != ''
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.cache.outputs.paths }}
        key: ${{ steps.cache.outputs.key }}
